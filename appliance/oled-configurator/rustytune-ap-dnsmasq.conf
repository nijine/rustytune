# RustyTune appliance AP policy.
#
# NetworkManager's IPv4 "shared" mode normally advertises the Pi as both the
# default router and DNS server. Suppress those DHCP options so a phone keeps
# its cellular default route while retaining direct access to 10.0.0.1.
#
# Installed as /etc/NetworkManager/dnsmasq-shared.d/rustytune-ap.conf.
dhcp-option=3
dhcp-option=6
