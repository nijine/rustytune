[workspace]
resolver = "2"
members = [
    "crates/ts-ini",
    "crates/ecu-proto",
    "crates/tune-model",
    "crates/datalog",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
indexmap = "2"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
