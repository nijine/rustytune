[package]
name = "rustytune-server"
version.workspace = true
edition.workspace = true
description = "rustytune server: owns the ECU serial port, serves the web UI and API"

[[bin]]
name = "rustytune"
path = "src/main.rs"

[dependencies]
ts-ini = { path = "../ts-ini" }
ecu-proto = { path = "../ecu-proto" }
tune-model = { path = "../tune-model" }
datalog = { path = "../datalog" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
mime_guess = "2"
open = "5"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
