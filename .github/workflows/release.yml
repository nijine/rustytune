# Tag v* to cut a release: single-binary builds (web UI embedded) for
# macOS arm64 and Linux x86_64/arm64 (the Pi target). Windows needs a
# serial transport port (the Unix one is open(2)+termios) — not yet built.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            name: macos-arm64
          - runner: ubuntu-latest
            name: linux-x86_64
          - runner: ubuntu-24.04-arm
            name: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          VITE_BUILD_SHA="$(git rev-parse --short HEAD)" npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p rustytune-server

      - name: Package
        run: |
          tar czf rustytune-${{ github.ref_name }}-${{ matrix.name }}.tar.gz \
            -C target/release rustytune

      - uses: softprops/action-gh-release@v2
        with:
          files: rustytune-*.tar.gz
          draft: true

  desktop:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            name: macos-arm64
            bundles: dmg
            artifact: target/release/bundle/dmg/*.dmg
          - runner: ubuntu-22.04
            name: linux-x86_64
            bundles: appimage
            artifact: target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          VITE_BUILD_SHA="$(git rev-parse --short HEAD)" npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Validate macOS signing configuration
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Build desktop bundle
        working-directory: crates/desktop
        env:
          APPLE_CERTIFICATE: ${{ vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Mark unsigned macOS artifact
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED != 'true'
        run: |
          for file in target/release/bundle/dmg/*.dmg; do
            mv "$file" "${file%.dmg}-unsigned.dmg"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          draft: true
